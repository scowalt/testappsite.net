name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketing-build:
    name: Marketing Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Read Bun version from mise
        id: bunversion
        run: echo "version=$(grep '^bun' .mise.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.bunversion.outputs.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build marketing site
        run: bun run build:marketing

      - name: Validate Worker deployment without credentials
        working-directory: apps/marketing
        run: bunx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
